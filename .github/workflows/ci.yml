name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npx bun test
      - name: Secret scan (tracked files)
        run: npx bun run script/scan-secrets.ts

  build:
    name: Build and smoke test (Linux, Debian 13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Build every target
        run: npx bun run script/build.ts --all
      - name: Compile the smoke test for Linux
        run: npx bun build --compile --target=bun-linux-x64 script/smoke.ts --outfile dist/smoke-linux-x64
      - name: Alpine musl smoke test
        run: |
          npx bun build --compile --target=bun-linux-x64-musl script/smoke.ts --outfile dist/smoke-linux-x64-musl
          docker run --rm -v "$PWD/dist:/s:ro" alpine:3.22 sh -c 'apk add --no-cache libstdc++ libgcc >/dev/null && /s/smoke-linux-x64-musl /s/linux-x64-musl/vedecaps'
      - name: Smoke test (Ubuntu)
        run: dist/smoke-linux-x64 dist/linux-x64/vedecaps
      - name: Smoke test (clean debian:13 container, only the binaries inside)
        run: docker run --rm -v "$PWD/dist:/s:ro" debian:13 /s/smoke-linux-x64 /s/linux-x64/vedecaps
      - name: Terminal UI in a pseudo-terminal (compiled binary, mock model)
        run: |
          python3 -m venv "$RUNNER_TEMP/tui-venv"
          "$RUNNER_TEMP/tui-venv/bin/python" -m pip install -r script/requirements-tui.txt
          "$RUNNER_TEMP/tui-venv/bin/python" script/tui-pty.py "$PWD/dist/linux-x64/vedecaps"
      - name: install.sh in a clean debian:13 container (local release host)
        run: |
          npx bun run script/release-server.ts dist 48731 &
          sleep 2
          docker run --rm --network host -v "$PWD/install.sh:/install.sh:ro" \
            -e VEDECAPS_RELEASE_URL=http://127.0.0.1:48731 \
            -e EXPECTED="$(node -p "require('./package.json').version")" debian:13 sh -c '
              set -e
              apt-get update -qq >/dev/null && apt-get install -y -qq curl ca-certificates >/dev/null
              sh /install.sh
              test "$($HOME/.vedecaps/bin/vedecaps --version)" = "$EXPECTED"
              sh /install.sh >/dev/null
              test "$(grep -c "# vedecaps" $HOME/.profile)" = 1
            '
      - name: Start a local release host and a mock model for the action test
        run: |
          nohup npx bun run script/release-server.ts dist 48732 >/dev/null 2>&1 &
          PORT=48733 nohup npx bun run script/mock-llm.ts >/dev/null 2>&1 &
          sleep 3
      - name: GitHub Action (composite) installs from the local release and runs the agent
        id: action
        uses: ./
        env:
          VEDECAPS_RELEASE_URL: http://127.0.0.1:48732
          VEDECAPS_DISABLE_LOCAL_DETECT: "1"
          VEDECAPS_DISABLE_MODELS_FETCH: "1"
        with:
          prompt: Summarise this repository
          config: >-
            {"model":"mock/m","snapshot":false,"provider":{"mock":{"name":"Mock","api":"http://127.0.0.1:48733/v1",
            "models":{"m":{"name":"M","tool_call":true,"limit":{"context":100000,"output":4000}}}}}}
      - name: Action output and installed version
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "$RESPONSE" | head -3
          echo "$RESPONSE" | grep -q "완료"
          expected="$(node -p "require('./package.json').version")"
          test "$("$HOME/.vedecaps/bin/vedecaps" --version)" = "$expected"
      - name: Prepare a throwaway repository with a local bare remote (never the real origin)
        run: |
          set -e
          root="$RUNNER_TEMP/action-commit"
          rm -rf "$root" && mkdir -p "$root"
          git init -q --bare "$root/remote.git"
          git init -q -b main "$root/work"
          cd "$root/work"
          git config user.email test@example.com
          git config user.name test
          echo "# demo" > README.md
          git add -A && git commit -qm init
          git remote add origin "$root/remote.git"
          git push -q origin main
      - name: GitHub Action with commit - the agent's change is committed and pushed
        id: commit
        uses: ./
        env:
          VEDECAPS_RELEASE_URL: http://127.0.0.1:48732
          VEDECAPS_DISABLE_LOCAL_DETECT: "1"
          VEDECAPS_DISABLE_MODELS_FETCH: "1"
        with:
          prompt: edit the notes
          working-directory: ${{ runner.temp }}/action-commit/work
          commit: "true"
          branch: vedecaps/ci-test
          commit-message: Add notes via Vedecaps
          config: >-
            {"model":"mock/m","snapshot":false,"provider":{"mock":{"name":"Mock","api":"http://127.0.0.1:48733/v1",
            "models":{"m":{"name":"M","tool_call":true,"limit":{"context":100000,"output":4000}}}}}}
      - name: Check what reached the remote
        env:
          CHANGED: ${{ steps.commit.outputs.changed }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          COMMIT: ${{ steps.commit.outputs.commit }}
          PR_URL: ${{ steps.commit.outputs.pull-request-url }}
        run: |
          set -e
          remote="$RUNNER_TEMP/action-commit/remote.git"
          test "$CHANGED" = "true"
          test "$BRANCH" = "vedecaps/ci-test"
          test -z "$PR_URL"
          test "$(git -C "$remote" rev-parse vedecaps/ci-test)" = "$COMMIT"
          test "$(git -C "$remote" log -1 --format=%s vedecaps/ci-test)" = "Add notes via Vedecaps"
          git -C "$remote" show vedecaps/ci-test:notes.txt | grep -q "line one"
          # main on the remote is untouched
          test "$(git -C "$remote" log -1 --format=%s main)" = "init"
      - name: Binaries must not embed build-machine paths
        run: |
          if strings -a dist/linux-x64/vedecaps | grep -E "/home/runner/|/Users/"; then
            echo "build-machine path found in the binary"; exit 1
          fi
      - name: Check release assets
        run: |
          ls -l dist
          cat dist/checksums.txt
          test "$(wc -l < dist/checksums.txt)" -eq 7
      - uses: actions/upload-artifact@v4
        with:
          name: vedecaps-binaries
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  windows-binary:
    name: Build and smoke test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build and package the Windows executable
        run: npx bun run script/build.ts --target windows-x64 --package
      - name: Smoke test
        run: npx bun run script/smoke.ts dist/windows-x64/vedecaps.exe
      - name: install.ps1 on Windows PowerShell 5.1 and PowerShell 7 (local release host)
        shell: pwsh
        run: |
          $server = Start-Process -FilePath (Resolve-Path 'node_modules/bun/bin/bun.exe') -ArgumentList 'run','script/release-server.ts','dist','48731' -PassThru -NoNewWindow
          Start-Sleep -Seconds 3
          $expected = (Get-Content package.json | ConvertFrom-Json).version
          $env:VEDECAPS_RELEASE_URL = 'http://127.0.0.1:48731'
          try {
            foreach ($shell in 'powershell', 'pwsh') {
              $dir = Join-Path $env:RUNNER_TEMP "vdc-$shell"
              $env:VEDECAPS_INSTALL_DIR = $dir
              & $shell -NoProfile -ExecutionPolicy Bypass -Command "Get-Content -Raw install.ps1 | Invoke-Expression"
              if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed under $shell" }
              $got = & (Join-Path $dir 'vedecaps.exe') --version
              if ($got -ne $expected) { throw "expected $expected, got $got under $shell" }
              # installing again over an existing copy must work too
              & $shell -NoProfile -ExecutionPolicy Bypass -Command "Get-Content -Raw install.ps1 | Invoke-Expression"
              if ($LASTEXITCODE -ne 0) { throw "reinstall failed under $shell" }
              $path = [Environment]::GetEnvironmentVariable('Path', 'User')
              if (($path -split ';' | Where-Object { $_ -eq $dir }).Count -ne 1) { throw "PATH entry for $dir is missing or duplicated" }
              Write-Host "install.ps1 ok under $shell ($got)"
            }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

  vscode-extension:
    name: VS Code extension and SDK build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extension typecheck and package
        working-directory: ide/vscode
        run: |
          npm ci
          npm run typecheck
          npm run package
          test -s vedecaps.vsix
      - name: SDK build
        working-directory: sdk/js
        run: |
          npm install --no-save typescript@5 @types/node@22
          npx tsc -p tsconfig.json
          test -s dist/index.js
      - uses: actions/upload-artifact@v4
        with:
          name: vedecaps-vscode
          path: ide/vscode/vedecaps.vsix

  go-sdk:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - run: go test ./...
        working-directory: sdk/go
