name: Verify release

# Installs the published release exactly the way the README tells users to.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpine:
    name: curl installer on Alpine
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    container: alpine:3.22
    steps:
      - run: |
          apk add --no-cache curl ca-certificates libstdc++ libgcc
          curl -fsSL https://raw.githubusercontent.com/nxodh/deberopa/main/install.sh | sh
          "$HOME/.deberopa/bin/deberopa" --version
          "$HOME/.deberopa/bin/deberopa" upgrade --check
  debian:
    name: curl | sh on Debian 13
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Install with the documented one-liner
        run: |
          apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
          curl -fsSL https://raw.githubusercontent.com/nxodh/deberopa/main/install.sh | sh
          "$HOME/.deberopa/bin/deberopa" --version
          "$HOME/.deberopa/bin/deberopa" --help | head -5
          "$HOME/.deberopa/bin/deberopa" upgrade --check

  windows:
    name: irm | iex on Windows
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - name: Install with the documented one-liner
        shell: pwsh
        run: |
          & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -Command "irm https://raw.githubusercontent.com/nxodh/deberopa/main/install.ps1 | iex"
          if ($LASTEXITCODE -ne 0) { throw 'install failed' }
          $exe = Join-Path $env:LOCALAPPDATA 'deberopa\bin\deberopa.exe'
          & $exe --version
          & $exe upgrade --check
          if ($LASTEXITCODE -ne 0) { throw 'installed binary failed' }

  desktop-debian:
    name: Deberopa Desktop archive on Debian 13
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Download, check the checksum, unpack, run the bundled CLI
        run: |
          apt-get update -qq && apt-get install -y -qq curl ca-certificates jq >/dev/null
          tag="$(curl -fsSL https://api.github.com/repos/nxodh/deberopa/releases/latest | jq -r .tag_name)"
          base="https://github.com/nxodh/deberopa/releases/download/$tag"
          curl -fsSLO "$base/deberopa-desktop-linux-x64.tar.gz"
          curl -fsSL "$base/checksums.txt" | grep ' deberopa-desktop-linux-x64.tar.gz$' | sha256sum -c -
          tar -xzf deberopa-desktop-linux-x64.tar.gz
          dir="$(ls -d deberopa-desktop-*-linux-x64)"
          test -x "$dir/deberopa-desktop"
          test -f "$dir/resources/app/extensions/deberopa-agent/extension.js"
          test ! -e "$dir/resources/app/extensions/copilot"
          test "$("$dir/resources/deberopa/deberopa" --version)" = "${tag#v}"
