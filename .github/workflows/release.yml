name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require successful CI for this exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          passed="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --branch main --event push --status completed --json conclusion --jq 'any(.[]; .conclusion == "success")')"
          test "$passed" = true || { echo "Full CI must pass for this commit before publishing."; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Typecheck, test, secret scan
        run: |
          npx tsc --noEmit
          npx bun test
          npx bun run script/scan-secrets.ts
      - name: Build every target
        run: npx bun run script/build.ts --all
      - name: Smoke test the Linux binary (Ubuntu and a clean debian:13 container)
        run: |
          npx bun build --compile --target=bun-linux-x64 script/smoke.ts --outfile dist/smoke-linux-x64
          dist/smoke-linux-x64 dist/linux-x64/deberopa
          docker run --rm -v "$PWD/dist:/s:ro" debian:13 /s/smoke-linux-x64 /s/linux-x64/deberopa
      - name: Smoke test the Alpine musl binary
        run: |
          npx bun build --compile --target=bun-linux-x64-musl script/smoke.ts --outfile dist/smoke-linux-x64-musl
          docker run --rm -v "$PWD/dist:/s:ro" alpine:3.22 sh -c 'apk add --no-cache libstdc++ libgcc >/dev/null && /s/smoke-linux-x64-musl /s/linux-x64-musl/deberopa'
      - name: Build the VS Code extension
        working-directory: ide/vscode
        run: |
          npm ci
          npm run typecheck
          npm run package
          test -s deberopa.vsix
          cp deberopa.vsix "../../dist/deberopa-vscode-$VERSION.vsix"
      - name: Release notes from the changelog
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Deberopa $VERSION" > notes.md
          cat >> notes.md <<'NOTES'

          ## Install

          Linux / macOS:
          ```sh
          curl -fsSL https://raw.githubusercontent.com/nxodh/deberopa/main/install.sh | sh
          ```
          Windows (PowerShell):
          ```powershell
          irm https://raw.githubusercontent.com/nxodh/deberopa/main/install.ps1 | iex
          ```
          Verify downloads against `checksums.txt` (SHA-256).
          NOTES
          sed -i 's/^          //' notes.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Deberopa $VERSION" --notes-file notes.md \
            dist/deberopa-linux-x64.tar.gz dist/deberopa-linux-arm64.tar.gz \
            dist/deberopa-linux-x64-musl.tar.gz dist/deberopa-linux-arm64-musl.tar.gz \
            dist/deberopa-darwin-arm64.tar.gz dist/deberopa-darwin-x64.tar.gz \
            dist/deberopa-windows-x64.zip dist/checksums.txt "dist/deberopa-vscode-$VERSION.vsix"
