name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Tag must match package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Typecheck, test, secret scan
        run: |
          npx tsc --noEmit
          npx bun test
          npx bun run script/scan-secrets.ts
      - name: Build every target
        run: npx bun run script/build.ts --all
      - name: Smoke test the Linux binary (Ubuntu and a clean debian:13 container)
        run: |
          npx bun build --compile --target=bun-linux-x64 script/smoke.ts --outfile dist/smoke-linux-x64
          dist/smoke-linux-x64 dist/linux-x64/vedecaps
          docker run --rm -v "$PWD/dist:/s:ro" debian:13 /s/smoke-linux-x64 /s/linux-x64/vedecaps
      - name: Release notes from the changelog
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Vedecaps $VERSION" > notes.md
          cat >> notes.md <<'NOTES'

          ## Install

          Linux / macOS:
          ```sh
          curl -fsSL https://raw.githubusercontent.com/nxodh/vedecaps/main/install.sh | sh
          ```
          Windows (PowerShell):
          ```powershell
          irm https://raw.githubusercontent.com/nxodh/vedecaps/main/install.ps1 | iex
          ```
          Verify downloads against `checksums.txt` (SHA-256).
          NOTES
          sed -i 's/^          //' notes.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Vedecaps $VERSION" --notes-file notes.md \
            dist/vedecaps-linux-x64.tar.gz dist/vedecaps-linux-arm64.tar.gz \
            dist/vedecaps-darwin-arm64.tar.gz dist/vedecaps-darwin-x64.tar.gz \
            dist/vedecaps-windows-x64.zip dist/checksums.txt
