name: Desktop build

# Builds Deberopa Desktop (Code - OSS + patches) on the platforms we support. It is slow (about an hour),
# so it runs on demand and when the Desktop sources change, never on every pull request.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop-build.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop-build.yml"]

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13 x64
            os: ubuntu-latest
            target: linux-x64
            cli: linux-x64
            exe: deberopa
          - name: Windows 11 x64
            os: windows-2022
            target: win32-x64
            cli: windows-x64
            exe: deberopa.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - name: Linux build dependencies
        if: matrix.target == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev pkg-config
      - name: Fetch, patch and install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node desktop/script/build.mjs --work ${{ runner.temp }}/deberopa-desktop --target ${{ matrix.target }} --stage fetch && node desktop/script/build.mjs --work ${{ runner.temp }}/deberopa-desktop --target ${{ matrix.target }} --stage patch && node desktop/script/build.mjs --work ${{ runner.temp }}/deberopa-desktop --target ${{ matrix.target }} --stage install
      - name: Build the CLI that ships inside the app
        run: npm ci && npx bun run script/build.ts --target ${{ matrix.cli }}
      - name: Package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node desktop/script/build.mjs --work ${{ runner.temp }}/deberopa-desktop --target ${{ matrix.target }} --stage package
      - name: Bundle the CLI
        run: node desktop/script/build.mjs --work ${{ runner.temp }}/deberopa-desktop --target ${{ matrix.target }} --stage bundle-cli --cli dist/${{ matrix.cli }}/${{ matrix.exe }}
      - name: Check the packaged product
        run: node desktop/script/check-product.mjs ${{ runner.temp }}/deberopa-desktop/VSCode-${{ matrix.target }}
      - name: Size of the packaged app
        shell: bash
        run: du -sh "${{ runner.temp }}/deberopa-desktop/VSCode-${{ matrix.target }}" && ls "${{ runner.temp }}/deberopa-desktop/VSCode-${{ matrix.target }}" | head -30
      - name: Run the packaged app (Linux, headless)
        if: matrix.target == 'linux-x64'
        run: |
          sudo apt-get install -y --no-install-recommends xvfb libgbm1 libasound2t64 libgtk-3-0t64 libnss3 libxss1 libxkbfile1 >/dev/null
          APP="${{ runner.temp }}/deberopa-desktop/VSCode-linux-x64"
          "$APP/bin/deberopa-desktop" --version --no-sandbox
          "$APP/resources/deberopa/deberopa" --version
          xvfb-run -a "$APP/bin/deberopa-desktop" --no-sandbox --user-data-dir "$RUNNER_TEMP/ud" --extensions-dir "$RUNNER_TEMP/ex" --list-extensions --show-versions | tee "$RUNNER_TEMP/exts.txt"
          test -f "$APP/resources/app/extensions/deberopa-agent/package.json"
          test -f "$APP/resources/app/extensions/deberopa-agent/extension.js"
          test ! -e "$APP/resources/app/extensions/copilot"
          ! grep -qi copilot "$RUNNER_TEMP/exts.txt"
      - name: "In-app test (Linux) - the agent extension starts the bundled server"
        if: matrix.target == 'linux-x64'
        run: |
          APP="${{ runner.temp }}/deberopa-desktop/VSCode-linux-x64"
          WORK="$RUNNER_TEMP/e2e-work"; mkdir -p "$WORK"
          export DEBEROPA_HOME="$RUNNER_TEMP/e2e-home" DEBEROPA_DISABLE_LOCAL_DETECT=1 DEBEROPA_DISABLE_MODELS_FETCH=1
          export DEBEROPA_E2E_LOG="$RUNNER_TEMP/e2e.log"
          # The Electron binary itself. bin/deberopa-desktop is a launcher that starts the app in the background
          # and returns at once, which made this step "pass" without the test ever running.
          BIN="$APP/deberopa-desktop"
          test -x "$BIN"
          status=0
          timeout 300 xvfb-run -a "$BIN" --no-sandbox --disable-gpu --disable-workspace-trust --verbose --enable-logging=stderr --v=0 \
            --logsPath "$RUNNER_TEMP/e2e-logs" --user-data-dir "$RUNNER_TEMP/e2e-ud" --extensions-dir "$RUNNER_TEMP/e2e-ex" \
            --extensionDevelopmentPath="$APP/resources/app/extensions/deberopa-agent" \
            --extensionTestsPath="$GITHUB_WORKSPACE/desktop/test/e2e/index.cjs" "$WORK" > "$RUNNER_TEMP/e2e.out" 2> "$RUNNER_TEMP/e2e.err" || status=$?
          echo "exit status: $status"
          echo "---- test log"; cat "$DEBEROPA_E2E_LOG" 2>/dev/null || echo "(the test wrote no log)"
          echo "---- app stdout (tail)"; tail -20 "$RUNNER_TEMP/e2e.out" | cut -c1-240
          echo "---- app stderr (tail)"; tail -30 "$RUNNER_TEMP/e2e.err" | cut -c1-240
          for f in window1/exthost/exthost.log window1/renderer.log; do echo "---- $f (tail)"; tail -40 "$RUNNER_TEMP/e2e-logs/$f" 2>/dev/null | cut -c1-260; done
          echo "---- errors in all logs"; grep -rhiE "\[error\]|uncaught|cannot find|failed to|extensionTests|deberopa-agent|e2e" "$RUNNER_TEMP/e2e-logs" 2>/dev/null | head -30 | cut -c1-260
          pkill -f "deberopa serve" || true
          # passing means the test said so, not merely that the process ended
          grep -q "\[e2e\].* OK" "$DEBEROPA_E2E_LOG" || { echo "the in-app test did not report OK"; exit 1; }
          exit $status
      - name: Run the packaged app (Windows)
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $app = "${{ runner.temp }}\deberopa-desktop\VSCode-win32-x64"
          Get-ChildItem $app | Select-Object -First 30 | Format-Table Name, Length
          & "$app\bin\deberopa-desktop.cmd" --version
          & "$app\resources\deberopa\deberopa.exe" --version
          $exe = Get-ChildItem $app -Filter *.exe | Where-Object { $_.Name -notmatch 'deberopa|unins|elevate|inno' } | Select-Object -First 1
          $exe.VersionInfo | Format-List FileName, CompanyName, ProductName, LegalCopyright, FileVersion
          if ($exe.VersionInfo.CompanyName -match 'Microsoft') { throw "the executable's file properties still name Microsoft as the company" }
          $exts = & "$app\bin\deberopa-desktop.cmd" --user-data-dir "$env:RUNNER_TEMP\ud" --extensions-dir "$env:RUNNER_TEMP\ex" --list-extensions --show-versions
          $exts
          if (-not (Test-Path "$app\resources\app\extensions\deberopa-agent\extension.js")) { throw "deberopa-agent is not built in" }
          if (Test-Path "$app\resources\app\extensions\copilot") { throw "the Copilot extension is present" }
          if ($exts -match 'copilot') { throw "a Copilot extension is listed" }
      - name: "In-app test (Windows) - the agent extension starts the bundled server"
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $app = "${{ runner.temp }}\deberopa-desktop\VSCode-win32-x64"
          $work = Join-Path $env:RUNNER_TEMP "e2e-work"; New-Item -ItemType Directory -Force $work | Out-Null
          $env:DEBEROPA_HOME = Join-Path $env:RUNNER_TEMP "e2e-home"
          $env:DEBEROPA_DISABLE_LOCAL_DETECT = "1"; $env:DEBEROPA_DISABLE_MODELS_FETCH = "1"
          & "$env:GITHUB_WORKSPACE\desktop\test\e2e\run-windows.ps1" -App $app -Work $work
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
