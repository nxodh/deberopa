# Answer "/vedecaps <request>" comments on issues and pull requests.
# Copy to .github/workflows/vedecaps.yml and add your provider key as a repository secret.
#
# SECURITY: the agent can run commands with this job's permissions, and issue/PR text is
# untrusted input that can try to steer it (prompt injection). Keep the job's permissions
# minimal, only act on comments from people you trust (the check below), and never expose
# secrets beyond the provider key.
name: vedecaps

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  vedecaps:
    if: >
      startsWith(github.event.comment.body, '/vedecaps') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # for a pull request, work on its head branch
          ref: ${{ github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number) || '' }}

      - name: Run Vedecaps
        id: vedecaps
        uses: nxodh/vedecaps@v0.1.1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          model: anthropic/claude-sonnet-5-5
          agent: plan # read-only; use "build" to let it change files
          prompt: ${{ github.event.comment.body }}

      - name: Reply
        env:
          GH_TOKEN: ${{ github.token }}
          RESPONSE: ${{ steps.vedecaps.outputs.response }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "$RESPONSE"
